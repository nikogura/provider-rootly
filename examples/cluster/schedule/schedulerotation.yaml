apiVersion: schedule.rootly.crossplane.io/v1alpha1
kind: ScheduleRotation
metadata:
  name: platform-oncall-weekly
spec:
  forProvider:
    name: Weekly
    # The schedule is referenced by name, not by pasting its Rootly UUID; the
    # provider resolves the id once the schedule exists.
    scheduleIdRef:
      name: platform-oncall
    scheduleRotationableType: ScheduleWeeklyRotation
    scheduleRotationableAttributes:
      handoffDay: M
      handoffTime: "10:00"
    # A 24/7 rotation: active every day, all day.
    activeAllWeek: true
    activeTimeType: all_day
    timeZone: America/Los_Angeles
    position: 1
  providerConfigRef:
    name: default
