name: Release

# Auto tag + release + publish, the same shape as diagnostic-bot: every green
# push to main computes the next semantic version from conventional commits,
# publishes the multi-arch provider image and xpkg to ghcr under that version,
# and cuts a GitHub Release whose tag IS the version. The release creates the
# git tag -- nothing tags by hand. tag.yaml is gone for that reason; the
# manual publish-provider-package.yml remains only as an escape hatch for
# republishing an existing tag.

on:
  push:
    branches:
      - main

env:
  DOCKER_BUILDX_VERSION: 'v0.34.1'

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    outputs:
      version_tag: ${{ steps.semver.outputs.version_tag }}
      version: ${{ steps.semver.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          fetch-depth: 0

      # Next version from commit messages since the last tag:
      #   MAJOR -> "type!:" subject or a BREAKING CHANGE footer
      #   MINOR -> "feat:" / "feat(scope):"
      #   PATCH -> anything else
      - name: Generate Version
        id: semver
        uses: paulhatch/semantic-version@a8f8f59fd7f0625188492e945240f12d7ad2dca3 # v5.4.0
        with:
          tag_prefix: "v"
          version_format: "${major}.${minor}.${patch}"
          major_pattern: '/^[a-z]+(\([^)]+\))?!:|BREAKING[ -]CHANGE:/'
          major_regexp_flags: "im"
          minor_pattern: '/^feat(\([^)]+\))?:/'
          minor_regexp_flags: "im"
          search_commit_body: true
          bump_each_commit: false

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Find the Go Build Cache
        id: go
        run: echo "cache=$(make go.cachedir)" >> $GITHUB_OUTPUT

      - name: Cache the Go Build Cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.go.outputs.cache }}
          key: ${{ runner.os }}-build-release-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-release-

      - name: Cache Go Dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .work/pkg
          key: ${{ runner.os }}-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-pkg-

      - name: Vendor Dependencies
        run: make vendor vendor.check

      # make lint installs its own tools (namedreturns into the build tools
      # dir, golangci-lint via the build submodule) -- nothing to preinstall.
      - name: Lint
        run: make lint

      - name: Test
        run: make test

  publish:
    runs-on: ubuntu-24.04
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      # The xpkg filename embeds VERSION at build time and the push target
      # reads it again -- build and publish MUST agree, so it is set once
      # for the whole job.
      VERSION: ${{ needs.test.outputs.version_tag }}

    steps:
      - name: Setup QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
        with:
          version: ${{ env.DOCKER_BUILDX_VERSION }}

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Find the Go Build Cache
        id: go
        run: echo "cache=$(make go.cachedir)" >> $GITHUB_OUTPUT

      - name: Cache the Go Build Cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.go.outputs.cache }}
          key: ${{ runner.os }}-build-publish-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-build-publish-

      - name: Cache Go Dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .work/pkg
          key: ${{ runner.os }}-pkg-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-pkg-

      - name: Vendor Dependencies
        run: make vendor vendor.check

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # publish pushes what build.all produced -- it does not build, and the
      # crossplane CLI it pushes with is installed by build.init. Skipping
      # this step is exactly the "crossplane-cli: No such file or directory"
      # failure.
      - name: Build Artifacts
        run: make -j2 build.all
        env:
          # buildx does not load built images into the docker daemon unless told to
          BUILD_ARGS: "--load"

      # Multi-arch (amd64+arm64) provider image plus the Crossplane package,
      # pushed to ghcr.io/nikogura under the computed version.
      - name: Publish Artifacts
        run: make -j2 publish BRANCH_NAME=main

      # The release creates the git tag (single `v` prefix); no separate
      # tagging action, and no duplicate `vv*` tags.
      - name: Publish Release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3.0.3
        with:
          tag_name: ${{ needs.test.outputs.version_tag }}
          name: ${{ needs.test.outputs.version_tag }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
