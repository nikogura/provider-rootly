    Resource rootly_workflow_task_call_people - terraform-provider-rootly:
        subCategory: Workflow Tasks
        description: Manages workflow call_people task.
        name: Resource rootly_workflow_task_call_people - terraform-provider-rootly
        title: Resource rootly_workflow_task_call_people - terraform-provider-rootly
        argumentDocs:
            content: (String) The message to be read by text-to-voice
            enabled: (Boolean) Enable/disable this workflow task
            id: (String) The ID of this resource.
            name: (String) Name of the workflow task
            phone_numbers: (List of String)
            position: (Number) The position of the workflow task (1 being top of list)
            skip_on_failure: (Boolean) Skip workflow task if any failures
            task_params: '(Block List, Min: 1, Max: 1) The parameters for this workflow task. (see below for nested schema)'
            task_type: (String)
            workflow_id: (String) The ID of the parent workflow
        importStatements:
            - |-
              resource "rootly_workflow_incident" "call_people" {
                name        = "Call a teammate"
                description = "Automatically call a specific teammate."
                trigger_params {
                  triggers                  = ["incident_created"]
                  incident_statuses         = ["started"]
                  incident_condition_status = "IS"
                }
                enabled = true
              }

              resource "rootly_workflow_task_call_people" "call_people" {
                workflow_id     = rootly_workflow_incident.call_people.id
                skip_on_failure = false
                enabled         = true
                task_params {
                  name    = "Call people"
                  content = "We have an ongoing incident {{ incident.title }} of severity {{ incident.severity }} and your assistance is required."
                }
                # TODO
              }
