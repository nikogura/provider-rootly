mchatka, Asia/Kamchatka, Marshall Is., Pacific/Majuro, Wellington, Pacific/Auckland, Chatham Is., Pacific/Chatham, Nuku'alofa, Pacific/Tongatapu, Samoa, Pacific/Apia, Tokelau Is., Pacific/Fakaofo.
            time_restrictions: (Block List) If time restrictions are set, alerts will follow this path when they arrive within the specified time ranges and meet the rules. (see below for nested schema)
            time_zone: (String) Time zone for the deferral window (IANA format, e.g. America/New_York). Only used with deferral_window rule type.
            tuesday: (Boolean) Whether the time block applies on Tuesday
