    Resource rootly_workflow_task_create_jira_issue - terraform-provider-rootly:
        subCategory: Workflow Tasks
        description: Manages workflow create_jira_issue task.
        name: Resource rootly_workflow_task_create_jira_issue - terraform-provider-rootly
        title: Resource rootly_workflow_task_create_jira_issue - terraform-provider-rootly
        argumentDocs:
            assign_user_email: (String) The assigned user's email
            custom_fields_mapping: (String) Custom field mappings. Can contain liquid markup and need to be valid JSON
            description: (String) The issue description
            due_date: (String) The due date
            enabled: (Boolean) Enable/disable this workflow task
            id: (String) The ID of this resource.
            integration: (Map of String) Map must contain two fields, id and name. Specify integration id if you have more than one Jira instance
            issue_type: (Map of String) Map must contain two fields, id and name. The issue type id and display name
            labels: (String) The issue labels
            name: (String) Name of the workflow task
            position: (Number) The position of the workflow task (1 being top of list)
            priority: (Map of String) Map must contain two fields, id and name. The priority id and display name
            project_key: (String) The project key
            reporter_user_email: (String) The reporter user's email
            retry_count: (Number) Number of times to retry on rate-limit (HTTP 429) responses (0-4). 0 disables retry.
            retry_wait_time: (Number) Seconds to wait before each retry (1-15). Retry-After header is honored when present and <= 90s, taking the larger of retry_wait_time and the header value.
            skip_on_failure: (Boolean) Skip workflow task if any failures
            status: (Map of String) Map must contain two fields, id and name. The status id and display name
            task_params: '(Block List, Min: 1, Max: 1) The parameters for this workflow task. (see below for nested schema)'
            task_type: (String)
            title: (String) The issue title
            update_payload: (String) Update payload. Can contain liquid markup and need to be valid JSON
            workflow_id: (String) The ID of the parent workflow
        importStatements:
            - |-
              resource "rootly_workflow_incident" "jira" {
                name        = "Create a Jira Issue"
                description = "Open Jira ticket whenever incident starts"
                trigger_params {
                  triggers                  = ["incident_created"]
                  incident_condition_kind   = "IS"
                  incident_kinds            = ["normal"]
                  incident_condition_status = "IS"
                  incident_statuses         = ["started"]
                }
                enabled = true
              }

              resource "rootly_workflow_task_create_jira_issue" "jira" {
                workflow_id     = rootly_workflow_incident.jira.id
                skip_on_failure = false
                enabled         = true
                task_params {
                  title       = "{{ incident.title }}"
                  description = "{{ incident.summary }}"
                  project_key = "ROOT"
                  issue_type = {
                    id   = "10001"
                    name = "Task"
                  }
                  status = {
                    id   = "10000"
                    name = "To Do"
                  }
                  labels = "{{ incident.environment_slugs | concat: incident.service_slugs | concat: incident.functionality_slugs | concat: incident.group_slugs | join: \",\" }}"
                }
              }
