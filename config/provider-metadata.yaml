name: rootlyhq/rootly
resources:
    Resource rootly_alert_field - terraform-provider-rootly:
        subCategory: ""
        name: Resource rootly_alert_field - terraform-provider-rootly
        title: Resource rootly_alert_field - terraform-provider-rootly
        argumentDocs:
            id: (String) The ID of this resource.
            kind: (String) The kind of alert field
            name: (String) The name of the alert field
            slug: (String, Deprecated) The slug of the alert field
        importStatements:
            - |-
              resource "rootly_alert_field" "cloud_region" {
                label = "Cloud Region"
                kind  = "select"
              }
    Resource rootly_alert_group - terraform-provider-rootly:
        subCategory: ""
        name: Resource rootly_alert_group - terraform-provider-rootly
        title: Resource rootly_alert_group - terraform-provider-rootly
        argumentDocs:
            alert_urgency_ids: (List of String) The Alert Urgency IDs to check in the condition. Only need to be set when the property field type is 'attribute', the property field name is 'alert_urgency' and the property field condition type is 'is_one_of' or 'is_not_one_of'
            attributes: (Block List) This field is deprecated. Please use the conditions field instead, attributes will be removed in the future. (see below for nested schema)
            condition_type: (String) Grouping condition for the alert group
            conditionable_id: (String) The ID of the conditionable. If conditionable_type is AlertField, this is the ID of the alert field.
            conditionable_type: (String) The type of the conditionable. Value must be one of AlertField.
            conditions: (Block List) The conditions for the alert group (see below for nested schema)
            deleted_at: (String) Date or deletion
            description: (String) The description of the alert group
            group_by_alert_title: (Boolean, Deprecated) [DEPRECATED] Whether the alerts are grouped by title or not. This field is deprecated. Please use the conditions field with advanced alert grouping instead.. Value must be one of true or false
            group_by_alert_urgency: (Boolean, Deprecated) [DEPRECATED] Whether the alerts are grouped by urgency or not. This field is deprecated. Please use the conditions field with advanced alert grouping instead.. Value must be one of true or false
            id: (String) The ID of this resource.
            json_path: (String) The JSON path to the value to group by.
            name: (String) The name of the alert group
            property_field_condition_type: (String) The condition type of the property field. Value must be one of is_one_of, is_not_one_of, contains, does_not_contain, starts_with, ends_with, matches_regex, is_empty, matches_existing_alert.
            property_field_name: (String) The name of the property field. If the property field type is selected as 'attribute', then the allowed property field names are 'summary' (for Title), 'description', 'alert_urgency' and 'external_url' (for Alert Source URL). If the property field type is selected as 'payload', then the property field name should be supplied in JSON Path syntax.
            property_field_type: (String) The type of the property field. Value must be one of attribute, payload, alert_field.
            property_field_value: (String) The value of the property field. Can be null if the property field condition type is 'is_one_of' or 'is_not_one_of'
            property_field_values: (List of String) The values of the property field. Used if the property field condition type is 'is_one_of' or 'is_not_one_of' except for when property field name is 'alert_urgency'
            record_id: (String) ID of the Alert Urgency to set.
            record_type: (String) Should be "AlertUrgency".
            slug: (String, Deprecated) [DEPRECATED] The slug of the alert group. Derived from name; any configured value is ignored.
            target_id: (String) id for the Group, Service or EscalationPolicy
            target_type: (String) The type of the target.. Value must be one of Group, Service, Functionality, EscalationPolicy.
            targets: (Block List) (see below for nested schema)
            time_window: (Number) Time window for the alert grouping
            values: (Block List) (see below for nested schema)
        importStatements:
            - |-
              resource "rootly_alert_group" "example" {
                name                 = "Alert group"
                condition_type       = "all"
                time_window          = 10
                group_by_alert_title = true

                attributes {
                  json_path = "$.title"
                }

                targets {
                  target_type = "Service"
                  target_id   = "<Service UUID>"
                }
              }
    Resource rootly_alert_route - terraform-provider-rootly:
        subCategory: ""
        name: Resource rootly_alert_route - terraform-provider-rootly
        title: Resource rootly_alert_route - terraform-provider-rootly
        argumentDocs:
            alert_urgency_ids: (List of String) The Alert Urgency IDs to check in the condition
            alerts_source_ids: (List of String)
            condition_groups: (Block List) Must be specified if fallback_rule is false. (see below for nested schema)
            conditionable_id: (String) The ID of the conditionable
            conditionable_type: (String) The type of the conditionable. Value must be one of AlertField.
            conditions: (Block List) (see below for nested schema)
            destinations: (Block List) (see below for nested schema)
            enabled: (Boolean)
            fallback_rule: (Boolean) Whether this is a fallback rule. Must be true if condition_groups is not specified.
            id: (String) The ID of this resource.
            name: (String) The name of the alert route
            owning_team_ids: (List of String)
            position: (Number) The position of the alert routing rule for ordering evaluation
            property_field_condition_type: (String) Value must be one of is_one_of, is_not_one_of, contains, does_not_contain, starts_with, ends_with, matches_regex, is_empty.
            property_field_name: (String) The name of the property field
            property_field_type: (String) Value must be one of attribute, payload, alert_field.
            property_field_value: (String) The value of the property field
            property_field_values: (List of String)
            rules: (Block List) (see below for nested schema)
            target_id: (String) The ID of the target
            target_type: (String) The type of the target. Value must be one of Service, Group, Functionality, EscalationPolicy.
        importStatements:
            - |-
              data "rootly_user" "user_1" {
                email = "john@example.com"
              }

              # Create teams and escalation policies to set as destinations/owner teams
              resource "rootly_team" "on_call_team" {
                name     = "On-Call Team"
                user_ids = [data.rootly_user.user_1.id]
              }

              resource "rootly_team" "security_team" {
                name     = "Security Team"
                user_ids = [data.rootly_user.user_1.id]
              }

              resource "rootly_escalation_policy" "production_ep" {
                name      = "Production Escalation"
                group_ids = [rootly_team.on_call_team.id]
              }

              resource "rootly_escalation_policy" "security_ep" {
                name      = "Security Escalation"
                group_ids = [rootly_team.security_team.id]
              }

              # Create alert fields for rule conditions
              resource "rootly_alert_field" "severity_field" {
                name = "Severity"
              }

              resource "rootly_alert_field" "service_field" {
                name = "Service"
              }

              # Create alert source to route from
              resource "rootly_alerts_source" "monitoring_source" {
                name        = "Production Monitoring"
                source_type = "generic_webhook"

                alert_source_fields_attributes {
                  alert_field_id = "538914bc-27d5-40d4-944b-ab1d71cc59b6" # Built-in title field
                  template_body  = "{{ alert.title }}"
                }

                alert_source_fields_attributes {
                  alert_field_id = resource.rootly_alert_field.severity_field.id
                  template_body  = "{{ alert.severity }}"
                }
              }

              # Create alert route with multiple rules
              resource "rootly_alert_route" "production_route" {
                name              = "Production Alert Routing"
                alerts_source_ids = [resource.rootly_alerts_source.monitoring_source.id]
                owning_team_ids   = [resource.rootly_team.on_call_team.id]
                enabled           = true

                rules {
                  name = "High Severity Route"
                  destinations {
                    target_type = "EscalationPolicy"
                    target_id   = rootly_escalation_policy.production_ep.id
                  }
                  condition_groups {
                    position = 1
                    conditions {
                      conditionable_type            = "AlertField"
                      conditionable_id              = resource.rootly_alert_field.severity_field.id
                      property_field_type           = "alert_field"
                      property_field_condition_type = "is_one_of"
                      property_field_values         = ["sev0", "sev1"]
                    }
                  }
                }

                rules {
                  name = "Security Route"
                  destinations {
                    target_type = "EscalationPolicy"
                    target_id   = rootly_escalation_policy.security_ep.id
                  }
                  condition_groups {
                    position = 1
                    conditions {
                      conditionable_type            = "AlertField"
                      conditionable_id              = resource.rootly_alert_field.service_field.id
                      property_field_type           = "alert_field"
                      property_field_condition_type = "contains"
                      property_field_value          = "security"
                    }
                  }
                }

                rules {
                  destinations {
                    target_type = "EscalationPolicy"
                    target_id   = rootly_escalation_policy.production_ep.id
                  }
                  fallback_rule = true
                }
              }
    Resource rootly_alert_routing_rule - terraform-provider-rootly:
        subCategory: ""
        name: Resource rootly_alert_routing_rule - terraform-provider-rootly
        title: Resource rootly_alert_routing_rule - terraform-provider-rootly
        argumentDocs:
            alerts_source_id: (String) The ID of the alerts source
            condition_groups: (Block List) The condition groups for the alert routing rule (see below for nested schema)
            condition_type: (String) The type of condition for the alert routing rule. Value must be one of all, any.
            conditionable_id: (String) The ID of the conditionable object
            conditionable_type: (String) The type of the conditionable object
            conditions: (Block List) The conditions for the alert routing rule (see below for nested schema)
            created_at: (String) Date of creation
            destination: '(Block List, Min: 1, Max: 1) The destinations for the alert routing rule (see below for nested schema)'
            enabled: (Boolean)
            id: (String) The ID of this resource.
            name: (String) The name of the alert routing rule
            position: (Number) The position of the alert routing rule for ordering evaluation
            property_field_condition_type: (String) The condition type of the property field. Value must be one of is_one_of, is_not_one_of, contains, does_not_contain, starts_with, ends_with, matches_regex, is_empty.
            property_field_name: (String) The name of the property field
            property_field_type: (String) The type of the property field. Value must be one of attribute, payload.
            property_field_value: (String) The value of the property field
            property_field_values: (List of String) The values of the property field
            target_id: (String) The ID of the target
            target_type: (String) The type of the target. Please contact support if you encounter issues using Functionality as a target type.. Value must be one of Service, Group, Functionality, EscalationPolicy.
            updated_at: (String) Date of last update
        importStatements:
            - |-
              resource "rootly_alert_routing_rule" "production_alerts" {
                name = "Route production alerts"
              }
    Resource rootly_alert_urgency - terraform-provider-rootly:
        subCategory: ""
        name: Resource rootly_alert_urgency - terraform-provider-rootly
        title: Resource rootly_alert_urgency - terraform-provider-rootly
        argumentDocs:
            color: (String) The color associated with this urgency level
            deleted_at: (String) Date of deletion
            description: (String) The description of the alert urgency
            id: (String) Unique ID of the alert urgency
            name: (String) The name of the alert urgency
            position: (Number) Position of the alert urgency
            team_id: (Number) The ID of the team this urgency belongs to
            urgency: (String) The urgency level
        importStatements:
            - |-
              resource "rootly_alert_urgency" "critical" {
                name        = "Critical"
                description = "Requires immediate attention — pages on-call"
              }

              resource "rootly_alert_urgency" "warning" {
                name        = "Warning"
                description = "Should be investigated within 30 minutes"
              }

              resource "rootly_alert_urgency" "informational" {
                name        = "Informational"
                description = "No immediate action required"
              }
    Resource rootly_alerts_source - terraform-provider-rootly:
        subCategory: ""
        name: Resource rootly_alerts_source - terraform-provider-rootly
        title: Resource rootly_alerts_source - terraform-provider-rootly
        argumentDocs:
            accept_threaded_emails: (Boolean) Set this to false to reject threaded emails. Value must be one of true or false
            alert_field_id: (String) The ID of the alert field
            alert_source_fields_attributes: '(Block List) List of alert fields to be added to the alert source. Note: This attribute requires the alert field feature to be enabled on your account. Contact Rootly customer support if you need assistance with this feature. (see below for nested schema)'
            alert_source_urgency_rules_attributes: (Block List) List of rules that define the conditions under which the alert urgency will be set automatically based on the alert payload (see below for nested schema)
            alert_template_attributes: '(Block List, Max: 1) Note that when alert fields are enabled at the team level, alert template attributes cannot be provided. Use alert_source_fields_attributes instead. (see below for nested schema)'
            alert_urgency_id: (String) ID for the default alert urgency assigned to this alert source
            auto_resolve: (Boolean) Set this to true to auto-resolve alerts based on field_mappings_attributes conditions. Value must be one of true or false
            condition_type: (String) The type of condition to evaluate to apply auto resolution rule. Value must be one of all, any.
            conditionable_id: (String) The ID of the conditionable. If conditionable_type is AlertField, this is the ID of the alert field.
            conditionable_type: (String) The type of the conditionable. Value must be one of AlertField or (empty string).
            conditions_attributes: (Block List) List of conditions to evaluate for auto resolution (see below for nested schema)
            deduplicate_alerts_by_key: (Boolean) Toggle alert deduplication using deduplication key. If enabled, deduplication_key_kind and deduplication_key_path are required.. Value must be one of true or false
            deduplication_key_kind: (String) Kind of deduplication key.. Value must be one of payload.
            deduplication_key_path: (String) Path to deduplication key. This is a JSON Path to extract the deduplication key from the request body.
            deduplication_key_regexp: (String) Regular expression to extract key from value found at key path.
            description: '- Alert description field'
            email: (String) The email generated for email alert sources
            enabled: (Boolean)
            external_url: '- Alert source URL/external URL field'
            field: (String) JSON path expression to extract a specific value from the alert's payload for evaluation
            field_mappings_attributes: (Block List) Specify rules to auto resolve alerts (see below for nested schema)
            id: (String) The ID of this resource.
            identifier_json_path: (String) JSON path expression to extract unique alert identifier used to match triggered alerts with resolving alerts
            identifier_matchable_id: (String) The ID of the identifier matchable. If identifier_matchable_type is AlertField, this is the ID of the alert field.
            identifier_matchable_type: (String) The type of the identifier matchable. Value must be one of AlertField.
            identifier_reference_kind: (String) The kind of the identifier reference. Value must be one of payload, alert_field.
            identifier_value_regex: (String) Regex group to further specify the part of the string used as a unique identifier
            json_path: (String) JSON path expression to extract a specific value from the alert's payload for evaluation
            kind: (String) The kind of the conditionable. Value must be one of payload, alert_field.
            name: (String) The name of the alert source
            operator: (String) Comparison operator used to evaluate the extracted value against the specified condition. Value must be one of is, is_not, contains, does_not_contain.
            owner_group_ids: (List of String) List of team IDs that will own the alert source
            resolution_rule_attributes: '(Block List, Max: 1) Provide additional attributes for email alerts source (see below for nested schema)'
            resolve_state: (String) This value is matched with the value extracted from alerts payload using JSON path in field_mappings_attributes
            secret: (String, Sensitive) The secret used to authenticate non-email alert sources
            source_type: (String) The alert source type. Value must be one of email, app_dynamics, catchpoint, datadog, dynatrace, alertmanager, google_cloud, grafana, sentry, generic_webhook, cloud_watch, aws_sns, checkly, azure, new_relic, splunk, chronosphere, app_optics, bug_snag, honeycomb, monte_carlo, nagios, prtg.
            sourceable_attributes: '(Block List, Max: 1) Provide additional attributes for generic_webhook alerts source (see below for nested schema)'
            status: (String) The status of the alert source. Value must be one of connected, setup_complete, setup_incomplete.
            template_body: (String) Liquid expression to extract a specific value from the alert's payload for evaluation
            title: '- Alert title field'
            value: (String) Value that the extracted payload data is compared to using the specified operator to determine a match
            webhook_endpoint: (String) The webhook URL generated for non-email alert sources
        importStatements:
            - |-
              # Required: Use data sources for title, description, and external_url fields
              data "rootly_alert_field" "title_field" {
                kind = "title"
              }

              data "rootly_alert_field" "description_field" {
                kind = "description"
              }

              data "rootly_alert_field" "source_link_field" {
                kind = "external_url"
              }

              resource "rootly_alerts_source" "example" {
                name        = "Generic webhook source"
                source_type = "generic_webhook"

                # Required alert source fields: title, description, and external_url
                # template_body can be omitted if you want to use the default value for the alert source field
                alert_source_fields_attributes {
                  alert_field_id = data.rootly_alert_field.title_field.id
                  template_body  = "Server exploded"
                }

                alert_source_fields_attributes {
                  alert_field_id = data.rootly_alert_field.description_field.id
                  template_body  = "Datacenter is burning down."
                }

                alert_source_fields_attributes {
                  alert_field_id = data.rootly_alert_field.source_link_field.id
                  template_body  = "https://rootly.com"
                }

                sourceable_attributes {
                  auto_resolve  = true
                  resolve_state = "$.status"

                  field_mappings_attributes {
                    field     = "state"
                    json_path = "$.my_group_attribute"
                  }

                  field_mappings_attributes {
                    field     = "external_id"
                    json_path = "$.my_id_attribute"
                  }
                }

                resolution_rule_attributes {
                  enabled                = true
                  condition_type         = "and"
                  identifier_json_path   = "$.email.subject"
                  identifier_value_regex = "ID:\\s*(\\w+)"
                  conditions_attributes {
                    field    = "$.email.body"
                    operator = "contains"
                    value    = "RESOLVED"
                  }
                  conditions_attributes {
                    field    = "$.email.body"
                    operator = "does_not_contain"
                    value    = "ERROR"
                  }
                }
              }
