    Resource rootly_escalation_level - terraform-provider-rootly:
        subCategory: ""
        name: Resource rootly_escalation_level - terraform-provider-rootly
        title: Resource rootly_escalation_level - terraform-provider-rootly
        argumentDocs:
            delay: (Number) Delay before notifying targets in the next Escalation Level.
            escalation_policy_id: (String) The ID of the escalation policy
            escalation_policy_path_id: (String) The ID of the dynamic escalation policy path the level will belong to. If nothing is specified it will add the level to your default path.
            id: (String) The ID of this resource.
            notification_target_params: '(Block List, Min: 1) Escalation level''s notification targets (see below for nested schema)'
            paging_strategy_configuration_page_users_count: (Number) Number of users to page at a time (cycle-based round robin).
            paging_strategy_configuration_repeats: (Number) Number of times to rotate through the roster (cycle-based round robin).
            paging_strategy_configuration_repeats_mode: '(String) Controls how repeats are interpreted: ''users'' pages exactly N users, ''all'' pages everyone once.. Value must be one of users, all.'
            paging_strategy_configuration_rotation_scope: '(String) Scope of rotation ordering: active rotation members only, or entire schedule.. Value must be one of active_rotation, entire_schedule.'
            paging_strategy_configuration_schedule_strategy: (String) Value must be one of on_call_only, everyone.
            paging_strategy_configuration_strategy: (String) Value must be one of default, random, cycle, alert.
            position: (Number) Position of the escalation policy level
            team_members: (String) For targets with type=team, controls whether to notify admins, all team members, or escalate to team EP.. Value must be one of all, admins, escalate.
            type: (String) The type of the notification target. Value must be one of team, user, schedule, slack_channel, microsoft_teams_channel, service.
        importStatements:
            - |-
              data "rootly_user" "john" {
                email = "demo@rootly.com"
              }

              data "rootly_user" "jane" {
                email = "demo1@rootly.com"
              }

              data "rootly_alert_urgency" "low" {
                name = "Low"
              }

              resource "rootly_team" "sre" {
                name     = "SREs On-Call"
                user_ids = [data.rootly_user.john.id, data.rootly_user.jane.id]
              }

              resource "rootly_schedule" "primary" {
                name              = "Primary On-Call Schedule"
                owner_user_id     = data.rootly_user.john.id
                all_time_coverage = false
              }

              resource "rootly_schedule_rotation" "weekdays" {
                schedule_id     = rootly_schedule.primary.id
                name            = "weekdays"
                active_all_week = false
                active_days = [
                  "M",
                  "T",
                  "W",
                  "R",
                  "F",
                ]
                active_time_type = "custom"
                position         = 1
                schedule_rotationable_attributes = {
                  handoff_time = "10:00"
                }
                schedule_rotationable_type = "ScheduleDailyRotation"
                time_zone                  = "America/Toronto"
              }

              # Define active days for the weekday rotation
              # Monday
              resource "rootly_schedule_rotation_active_day" "m1-weekday" {
                schedule_rotation_id = rootly_schedule_rotation.weekdays.id
                day_name             = "M"
                active_time_attributes {
                  start_time = "10:00"
                  end_time   = "18:00"
                }
              }
              # Tuesday
              resource "rootly_schedule_rotation_active_day" "t1-weekday" {
                schedule_rotation_id = rootly_schedule_rotation.weekdays.id
                day_name             = "T"
                active_time_attributes {
                  start_time = "10:00"
                  end_time   = "18:00"
                }
              }
              # Wednesday
              resource "rootly_schedule_rotation_active_day" "w1-weekday" {
                schedule_rotation_id = rootly_schedule_rotation.weekdays.id
                day_name             = "W"
                active_time_attributes {
                  start_time = "10:00"
                  end_time   = "18:00"
                }
              }
              # Thursday
              resource "rootly_schedule_rotation_active_day" "th1-weekday" {
                schedule_rotation_id = rootly_schedule_rotation.weekdays.id
                day_name             = "R"
                active_time_attributes {
                  start_time = "10:00"
                  end_time   = "18:00"
                }
              }
              # Friday
              resource "rootly_schedule_rotation_active_day" "f1-weekday" {
                schedule_rotation_id = rootly_schedule_rotation.weekdays.id
                day_name             = "F"
                active_time_attributes {
                  start_time = "10:00"
                  end_time   = "18:00"
                }
              }

              resource "rootly_schedule_rotation_user" "john" {
                schedule_rotation_id = rootly_schedule_rotation.weekdays.id
                position             = 1
                user_id              = data.rootly_user.john.id
              }

              resource "rootly_schedule_rotation_user" "jane" {
                schedule_rotation_id = rootly_schedule_rotation.weekdays.id
                position             = 2
                user_id              = data.rootly_user.jane.id
              }

              resource "rootly_escalation_policy" "primary" {
                name      = "Primary"
                group_ids = [rootly_team.sre.id]
              }

              resource "rootly_escalation_path" "default" {
                name                 = "Default"
                default              = true
                escalation_policy_id = rootly_escalation_policy.primary.id
              }

              resource "rootly_escalation_path" "ignore" {
                name                 = "Ignore"
                default              = false
                escalation_policy_id = rootly_escalation_policy.primary.id
                rules {
                  rule_type   = "alert_urgency"
                  urgency_ids = [data.rootly_alert_urgency.low.id]
                }
              }

              resource "rootly_escalation_level" "first" {
                escalation_policy_path_id = rootly_escalation_path.default.id
                escalation_policy_id      = rootly_escalation_policy.primary.id
                position                  = 1
                notification_target_params {
                  team_members = "all"
                  type         = "slack_channel"
                  id           = "C06D4QHLAUE"
                }
                notification_target_params {
                  type         = "schedule"
                  id           = rootly_schedule.primary.id
                  team_members = "all"
                }
              }

              # cycle-based round-robin everyone on the schedule
              resource "rootly_escalation_level" "second" {
                escalation_policy_path_id                       = rootly_escalation_path.default.id
                escalation_policy_id                            = rootly_escalation_policy.primary.id
                position                                        = 2
                delay                                           = 5
                paging_strategy_configuration_strategy          = "cycle"
                paging_strategy_configuration_schedule_strategy = "everyone"
                notification_target_params {
                  type         = "schedule"
                  id           = rootly_schedule.primary.id
                  team_members = "all"
                }
              }

              # cycle-based round-robin: page 3 users at a time from the active rotation
              resource "rootly_escalation_level" "third" {
                escalation_policy_path_id                       = rootly_escalation_path.default.id
                escalation_policy_id                            = rootly_escalation_policy.primary.id
                position                                        = 3
                delay                                           = 5
                paging_strategy_configuration_strategy          = "cycle"
                paging_strategy_configuration_schedule_strategy = "everyone"
                paging_strategy_configuration_repeats_mode      = "users"
                paging_strategy_configuration_repeats           = 3
                paging_strategy_configuration_rotation_scope    = "active_rotation"
                paging_strategy_configuration_page_users_count  = 2
                notification_target_params {
                  type = "schedule"
                  id   = rootly_schedule.primary.id
                }
              }
    Resource rootly_escalation_path - terraform-provider-rootly:
        subCategory: ""
        name: Resource rootly_escalation_path - terraform-provider-rootly
        title: Resource rootly_escalation_path - terraform-provider-rootly
        argumentDocs:
            after_deferral_behavior: (String) What happens after a deferral path finishes. Required for deferral paths.. Value must be one of re_evaluate, execute_path.
            after_deferral_path_id: (String) The escalation path to execute after this deferral path when after_deferral_behavior is execute_path.
            all_day: (Boolean) Whether this time block covers the entire day
            default: (Boolean) Whether this escalation path is the default path. Value must be one of true or false
            end_day: (String) Value must be one of monday, tuesday, wednesday, thursday, friday, saturday, sunday.
            end_time: (String) Formatted as HH:MM
            escalation_policy_id: (String) The ID of the escalation policy
            fieldable_id: (String) The ID of the alert field. Only used with field rule type.
            fieldable_type: (String) The type of the fieldable. Only used with field rule type. Value must be one of AlertField.
            friday: (Boolean) Whether the time block applies on Friday
            id: (String) The ID of this resource.
            initial_delay: (Number) Initial delay for escalation path in minutes. Maximum 1 week (10080).
            json_path: (String) JSON path to extract value from payload
            match_mode: (String) How path rules are matched.. Value must be one of match-all-rules, match-any-rule.
            monday: (Boolean) Whether the time block applies on Monday
            name: (String) The name of the escalation path
            notification_type: (String) Notification rule type
            operator: '(String) How the value should be matched. For json_path rule type: is, is_not, contains, does_not_contain. For field rule type: is, is_not, contains, does_not_contain, is_one_of, is_not_one_of, is_empty, is_not_empty, contains_key, does_not_contain_key, starts_with, does_not_start_with, matches, does_not_match. For source rule type: is, is_not, is_one_of, is_not_one_of. For related_incidents rule type: is_set, is_not_set.'
            path_type: (String) The type of escalation path. Cannot be changed after creation.. Value must be one of escalation, deferral.
            position: (Number) The position of this path in the paths for this EP.
            repeat: (Boolean) Whether this path should be repeated until someone acknowledges the alert. Value must be one of true or false
            repeat_count: (Number) The number of times this path will be executed until someone acknowledges the alert
            rule_type: (String) The type of the escalation path rule. Value must be one of alert_urgency, working_hour, json_path, field, service, deferral_window, source, related_incidents.
            rules: (Block List) Escalation path rules (see below for nested schema)
            saturday: (Boolean) Whether the time block applies on Saturday
