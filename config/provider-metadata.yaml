        name: Resource rootly_catalog_property - terraform-provider-rootly
        title: Resource rootly_catalog_property - terraform-provider-rootly
        argumentDocs:
            catalog_id: (String)
            catalog_type: (String) The type of catalog the property belongs to.. Value must be one of catalog, cause, environment, functionality, incident_type, service, team.
