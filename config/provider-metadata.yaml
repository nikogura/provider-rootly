    Resource rootly_schedule - terraform-provider-rootly:
        subCategory: ""
        name: Resource rootly_schedule - terraform-provider-rootly
        title: Resource rootly_schedule - terraform-provider-rootly
        argumentDocs:
            all_time_coverage: (Boolean) 24/7 coverage of the schedule. Value must be one of true or false
            description: (String) The description of the schedule
            id: (String) The ID of this resource.
            include_shadows_in_slack_notifications: (Boolean) Whether shadow users are included in Slack notifications and user group syncing. Value must be one of true or false
            name: (String) The name of the schedule
            owner_group_ids: (List of String) The owning teams for this schedules.
            owner_user_id: (Number) ID of user assigned as owner of the schedule. Defaults to the API token's user if not specified.
            shift_report_day_of_week: (String) Day of week the weekly shift summary is sent. Value must be one of monday, tuesday, wednesday, thursday, friday, saturday, sunday.
            shift_report_enabled: (Boolean) Whether the weekly shift summary report is sent. Requires slack_channel to be set. Value must be one of true or false
            shift_report_time_of_day: (String) Time of day the weekly shift summary is sent, in HH:MM 24-hour format.
            shift_report_time_zone: (String) IANA time zone used for the weekly shift summary (e.g. Australia/Sydney).
            shift_start_notifications_enabled: (Boolean) Whether to send a Slack message every time a new shift begins. Requires slack_channel to be set. Value must be one of true or false
            shift_update_notifications_enabled: (Boolean) Whether to send a Slack message whenever a shift is updated (overrides, removed users, rotation changes, etc.). Requires slack_channel to be set. Value must be one of true or false
            slack_channel: (Map of String) Map must contain two fields, id and name. Synced slack channel of the schedule
            slack_user_group: (Map of String) Map must contain two fields, id and name. Synced slack group of the schedule
            sync_linear_enabled: (Boolean) Whether the schedule is synced with Linear. Value must be one of true or false
            time_zone: (String) A valid IANA time zone name. Only applicable when config_one_timezone_per_schedule_enabled is true for the organization.
        importStatements:
            - |-
              data "rootly_user" "john" {
                email = "demo@rootly.com"
              }

              data "rootly_user" "jane" {
                email = "demo1@rootly.com"
              }

              resource "rootly_schedule" "primary" {
                name              = "Primary On-Call Schedule"
                owner_user_id     = data.rootly_user.john.id
                all_time_coverage = false
              }

              resource "rootly_schedule_rotation" "weekdays" {
                schedule_id     = rootly_schedule.primary.id
                name            = "weekdays"
                active_all_week = false
                active_days = [
                  "M",
                  "T",
                  "W",
                  "R",
                  "F",
                ]
                active_time_type = "custom"
                position         = 1
                schedule_rotationable_attributes = {
                  handoff_time = "T",
                  handoff_time = "10:00"
                }
                schedule_rotationable_type = "ScheduleWeeklyRotation"
                time_zone                  = "America/Toronto"
              }

              # Define active days for the weekday rotation
              # Monday
              resource "rootly_schedule_rotation_active_day" "m1-weekday" {
                schedule_rotation_id = rootly_schedule_rotation.weekdays.id
                day_name             = "M"
                active_time_attributes {
                  start_time = "10:00"
                  end_time   = "18:00"
                }
              }
              # Tuesday
              resource "rootly_schedule_rotation_active_day" "t1-weekday" {
                schedule_rotation_id = rootly_schedule_rotation.weekdays.id
                day_name             = "T"
                active_time_attributes {
                  start_time = "10:00"
                  end_time   = "18:00"
                }
              }
              # Wednesday
              resource "rootly_schedule_rotation_active_day" "w1-weekday" {
                schedule_rotation_id = rootly_schedule_rotation.weekdays.id
                day_name             = "W"
                active_time_attributes {
                  start_time = "10:00"
                  end_time   = "18:00"
                }
              }
              # Thursday
              resource "rootly_schedule_rotation_active_day" "th1-weekday" {
                schedule_rotation_id = rootly_schedule_rotation.weekdays.id
                day_name             = "R"
                active_time_attributes {
                  start_time = "10:00"
                  end_time   = "18:00"
                }
              }
              # Friday
              resource "rootly_schedule_rotation_active_day" "f1-weekday" {
                schedule_rotation_id = rootly_schedule_rotation.weekdays.id
                day_name             = "F"
                active_time_attributes {
                  start_time = "10:00"
                  end_time   = "18:00"
                }
              }

              resource "rootly_schedule_rotation_user" "john" {
                schedule_rotation_id = rootly_schedule_rotation.weekdays.id
                position             = 1
                user_id              = data.rootly_user.john.id
              }

              resource "rootly_schedule_rotation_user" "jane" {
                schedule_rotation_id = rootly_schedule_rotation.weekdays.id
                position             = 2
                user_id              = data.rootly_user.jane.id
              }
    Resource rootly_schedule_rotation - terraform-provider-rootly:
        subCategory: ""
        description: Manages a schedule rotation.
        name: Resource rootly_schedule_rotation - terraform-provider-rootly
        title: Resource rootly_schedule_rotation - terraform-provider-rootly
        argumentDocs:
            active_all_week: (Boolean) Schedule rotation active all week?
            active_days: (Set of String) Value must be one of S, M, T, W, R, F, U.
            active_time_attributes: (Block Set) Schedule rotation's active times. (see below for nested schema)
            active_time_type: (String) Value must be one of all_day, same_time, or custom. The value chosen will override active_time_attributes in any rootly_schedule_rotation_active_day resources linked to this rootly_schedule_rotation.
            end_time: (String) ISO8601 date and time when rotation ends. Shifts will only be created before this time.
            handoff_day: (String) Hand off day. Only applicable for weekly/biweekly, and monthly.
            handoff_time: (String) Hand off time. Only applicable for daily, weekly/biweekly, monthly, and custom rotations.
            id: (String) The ID of this resource.
            member_id: (String) ID of the member.
            member_type: (String) Type of member. Value must be one of Schedule or User.
            name: (String) The name of the schedule rotation.
            position: (Number) Position of the schedule rotation.
            schedule_id: (String) The ID of parent schedule.
            schedule_rotation_members: (Block Set) Schedule rotation members. You can only add schedule rotation members if your account has schedule nesting feature enabled. (see below for nested schema)
            schedule_rotationable_attributes: '(Attributes) handoff_time and/or handoff_day may be required, depending on schedule_rotationable_type. Please see API docs for options based on schedule_rotationable_type: https://docs.rootly.com/api-reference/schedulerotations/creates-a-schedule-rotation#response-data-attributes-schedule-rotationable-attributes (see below for nested schema)'
            schedule_rotationable_type: (String) Schedule rotation type. Value must be one of ScheduleDailyRotation, ScheduleWeeklyRotation, ScheduleBiweeklyRotation, ScheduleMonthlyRotation, ScheduleCustomRotation.
            shift_length: (Number) Shift length for custom rotation.
            shift_length_unit: (String) Shift length unit for custom rotation. Value must be one of hours, days, weeks.
            start_time: (String) ISO8601 date and time when rotation starts. Shifts will only be created after this time.
            time_zone: (String) A valid IANA time zone name.
        importStatements:
            - |-
              data "rootly_user" "john" {
                email = "demo@rootly.com"
              }

              data "rootly_user" "jane" {
                email = "demo1@rootly.com"
              }

              data "rootly_alert_urgency" "low" {
                name = "Low"
              }

              resource "rootly_team" "sre" {
                name     = "SREs On-Call"
                user_ids = [data.rootly_user.john.id, data.rootly_user.jane.id]
              }

              resource "rootly_schedule" "primary" {
                name              = "Primary On-Call Schedule"
                owner_user_id     = data.rootly_user.john.id
                all_time_coverage = false
              }

              resource "rootly_schedule_rotation" "weekdays" {
                schedule_id     = rootly_schedule.primary.id
                name            = "weekdays"
                active_all_week = false
                active_days = [
                  "M",
                  "T",
                  "W",
                  "R",
                  "F",
                ]
                active_time_type = "custom"
                position         = 1
                schedule_rotationable_attributes = {
                  handoff_time = "10:00"
                }
                schedule_rotationable_type = "ScheduleDailyRotation"
                time_zone                  = "America/Toronto"

                schedule_rotation_members {
                  member_type = "User"
                  member_id   = data.rootly_user.john.id
                  position    = 1
                }

                schedule_rotation_members {
                  member_type = "User"
                  member_id   = data.rootly_user.jane.id
                  position    = 2
                }
              }

              # Define active days for the weekday rotation
              # Monday
              resource "rootly_schedule_rotation_active_day" "m1-weekday" {
                schedule_rotation_id = rootly_schedule_rotation.weekdays.id
                day_name             = "M"
                active_time_attributes {
                  start_time = "10:00"
                  end_time   = "18:00"
                }
              }
              # Tuesday
              resource "rootly_schedule_rotation_active_day" "t1-weekday" {
                schedule_rotation_id = rootly_schedule_rotation.weekdays.id
                day_name             = "T"
                active_time_attributes {
                  start_time = "10:00"
                  end_time   = "18:00"
                }
              }
              # Wednesday
              resource "rootly_schedule_rotation_active_day" "w1-weekday" {
                schedule_rotation_id = rootly_schedule_rotation.weekdays.id
                day_name             = "W"
                active_time_attributes {
                  start_time = "10:00"
                  end_time   = "18:00"
                }
              }
              # Thursday
              resource "rootly_schedule_rotation_active_day" "th1-weekday" {
                schedule_rotation_id = rootly_schedule_rotation.weekdays.id
                day_name             = "R"
                active_time_attributes {
                  start_time = "10:00"
                  end_time   = "18:00"
                }
              }
              # Friday
              resource "rootly_schedule_rotation_active_day" "f1-weekday" {
                schedule_rotation_id = rootly_schedule_rotation.weekdays.id
                day_name             = "F"
                active_time_attributes {
                  start_time = "10:00"
                  end_time   = "18:00"
                }
              }

              resource "rootly_escalation_policy" "primary" {
                name      = "Primary"
                group_ids = [rootly_team.sre.id]
              }

              resource "rootly_escalation_path" "default" {
                name                 = "Default"
                default              = true
                escalation_policy_id = rootly_escalation_policy.primary.id
              }

              resource "rootly_escalation_path" "ignore" {
                name                 = "Ignore"
                default              = false
                escalation_policy_id = rootly_escalation_policy.primary.id
                rules {
                  rule_type   = "alert_urgency"
                  urgency_ids = [data.rootly_alert_urgency.low.id]
                }
              }

              resource "rootly_escalation_level" "first" {
                escalation_policy_path_id = rootly_escalation_path.default.id
                escalation_policy_id      = rootly_escalation_policy.primary.id
                position                  = 1
                notification_target_params {
                  team_members = "all"
                  type         = "slack_channel"
                  id           = "C06D4QHLAUE"
                }
                notification_target_params {
                  type         = "schedule"
                  id           = rootly_schedule.primary.id
                  team_members = "all"
                }
              }

              # cycle-based round-robin everyone on the schedule
              resource "rootly_escalation_level" "second" {
                escalation_policy_path_id                       = rootly_escalation_path.default.id
                escalation_policy_id                            = rootly_escalation_policy.primary.id
                position                                        = 2
                delay                                           = 5
                paging_strategy_configuration_strategy          = "cycle"
                paging_strategy_configuration_schedule_strategy = "everyone"
                notification_target_params {
                  type         = "schedule"
                  id           = rootly_schedule.primary.id
                  team_members = "all"
                }
              }
